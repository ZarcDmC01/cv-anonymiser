<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — CV Anonymiser</title>
<style>
  :root { --navy:#0d1b2a; --teal:#00c9a7; --teal2:#00a38a; --txt:#e2e8f0; --mut:#94a3b8; --err:#ff6b6b; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:24px 16px; font-family:system-ui,"Segoe UI",sans-serif; color:var(--txt);
    background: radial-gradient(900px 500px at 15% -10%, #0e4a4a55, transparent), radial-gradient(800px 500px at 100% 100%, #1d3a6a55, transparent), var(--navy); }
  .card { width:100%; max-width:400px; background:linear-gradient(160deg,#16314a99,#0d1b2acc); border:1px solid #ffffff14; border-radius:18px; padding:26px; box-shadow:0 20px 50px #0006; }
  h1 { text-align:center; font-size:26px; margin-bottom:4px; } h1 span { color:var(--teal); }
  p.sub { text-align:center; color:var(--mut); font-size:14px; margin-bottom:18px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; padding:9px; border-radius:999px; border:1px solid #ffffff1a; background:#ffffff0d; color:var(--mut); font-weight:600; cursor:pointer; }
  .tabs button.on { background:linear-gradient(135deg,var(--teal),var(--teal2)); color:var(--navy); border-color:transparent; }
  label { display:block; font-size:13px; color:var(--mut); margin:12px 0 4px; }
  input, select { width:100%; padding:11px 13px; border-radius:10px; border:1px solid #ffffff22; background:#0d1b2a; color:var(--txt); font-size:14px; outline:none; }
  input:focus, select:focus { border-color:var(--teal); }
  button.go { width:100%; margin-top:18px; padding:12px; border:0; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg,var(--teal),var(--teal2)); }
  #err { color:var(--err); font-size:14px; margin-top:12px; min-height:18px; text-align:center; }
  .reg { display:none; }
</style>
</head>
<body>
<form class="card" onsubmit="go(event)">
  <h1>📄 CV <span>Anonymiser</span></h1>
  <p class="sub" id="sub"></p>
  <div class="tabs">
    <button type="button" id="t-login" class="on" onclick="mode('login')">Connexion</button>
    <button type="button" id="t-reg" onclick="mode('reg')">Créer un compte</button>
  </div>
  <div class="reg"><label>Nom (ou entreprise)</label><input id="name" autocomplete="name"></div>
  <label>E-mail</label><input id="email" type="email" required autocomplete="username">
  <label>Mot de passe</label><input id="pwd" type="password" required minlength="6" autocomplete="current-password">
  <div class="reg">
    <div id="inv" style="display:none"><label>Code d'invitation ESM</label><input id="invite"></div>
  </div>
  <button class="go" id="btn">Se connecter</button>
  <div id="err"></div>
</form>
<script>
const $ = id => document.getElementById(id); let REG = false;
function mode(m) {
  REG = m === "reg";
  $("t-login").classList.toggle("on", !REG); $("t-reg").classList.toggle("on", REG);
  document.querySelectorAll(".reg").forEach(e => e.style.display = REG ? "block" : "none");
  $("btn").textContent = REG ? "Créer mon compte" : "Se connecter"; $("err").textContent = ""; invite();
}
const ROLE = "__ROLE__"; $("sub").textContent = ROLE === "esm" ? "Espace ESN — création et gestion des CV" : "Espace Entreprises — recherche de profils";
function invite() { $("inv").style.display = REG && ROLE === "esm" ? "block" : "none"; }
async function go(e) {
  e.preventDefault(); $("err").textContent = "";
  const body = { email: $("email").value, password: $("pwd").value };
  if (REG) Object.assign(body, { name: $("name").value, invite: $("invite").value });
  try {
    const r = await fetch(REG ? "/auth/register" : "/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "Champs invalides");
    location.href = ROLE === "esm" ? "/esm" : "/entreprises";
  } catch (x) { $("err").textContent = x.message; }
}
</script>
</body>
</html>
