<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entreprises — CV Anonymiser</title>
<style>
  :root { --navy:#0d1b2a; --teal:#00c9a7; --teal2:#00a38a; --txt:#e2e8f0; --mut:#94a3b8; --err:#ff6b6b; --warn:#fbbf24; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; padding:24px 16px 48px; font-family:system-ui,"Segoe UI",sans-serif; color:var(--txt);
    background: radial-gradient(900px 500px at 15% -10%, #0e4a4a55, transparent), radial-gradient(800px 500px at 100% 100%, #1d3a6a55, transparent), var(--navy); }
  main { max-width:1100px; margin:auto; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .top h1 { font-size:24px; flex:1; } .top h1 span { color:var(--teal); }
  .btn { padding:9px 15px; border-radius:10px; font-weight:600; font-size:14px; border:1px solid #00c9a755; color:var(--txt); background:transparent; cursor:pointer; text-decoration:none; }
  .btn:hover { background:#00c9a71f; } .btn.primary { background:linear-gradient(135deg,var(--teal),var(--teal2)); color:var(--navy); border:0; }
  .btn:disabled { opacity:.5; cursor:default; }
  nav { display:flex; gap:8px; margin-bottom:18px; }
  nav button { background:#ffffff0d; border:1px solid #ffffff1a; color:var(--mut); padding:9px 20px; border-radius:999px; cursor:pointer; font-weight:600; }
  nav button.on { background:linear-gradient(135deg,var(--teal),var(--teal2)); color:var(--navy); border-color:transparent; }
  .card { background:linear-gradient(160deg,#16314a99,#0d1b2acc); border:1px solid #ffffff14; border-radius:16px; padding:18px; }
  .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:16px; }
  .filters label { font-size:12px; color:var(--mut); display:block; margin-bottom:3px; }
  input, textarea { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #ffffff22; background:#0d1b2a; color:var(--txt); font-size:14px; outline:none; font-family:inherit; }
  input:focus, textarea:focus { border-color:var(--teal); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; }
  .cv h3 { font-size:16px; margin-bottom:2px; } .cv .ref { color:var(--teal); font-size:12px; font-weight:700; }
  .cv .meta { color:var(--mut); font-size:13px; margin:6px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 12px; }
  .chip { background:#9f123933; border:1px solid #9f123977; border-radius:999px; padding:2px 9px; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .st { font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .st.pending { background:#fbbf2422; color:var(--warn); } .st.accepted { background:#00c9a722; color:#2ee6c5; } .st.refused { background:#ff6b6b22; color:var(--err); }
  .empty { text-align:center; color:var(--mut); padding:40px; }
  .perso { margin-top:8px; padding:10px 12px; background:#00c9a712; border:1px solid #00c9a744; border-radius:10px; font-size:13px; line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { padding:10px; border-top:1px solid #ffffff10; text-align:left; vertical-align:top; }
  th { color:var(--teal); font-size:12px; text-transform:uppercase; border-top:0; }
  #bell { position:relative; } #bell b { position:absolute; top:-6px; right:-6px; background:var(--err); color:#fff; border-radius:999px; font-size:11px; padding:1px 6px; }
  #notifs { display:none; position:absolute; right:16px; top:64px; width:min(360px,92vw); max-height:60vh; overflow:auto; z-index:5; background:#0b1623; border:1px solid #ffffff22; border-radius:12px; padding:8px; box-shadow:0 20px 50px #000a; }
  #notifs div { padding:9px 10px; border-bottom:1px solid #ffffff10; font-size:13px; } #notifs small { color:var(--mut); display:block; }
  #notifs .new { border-left:3px solid var(--teal); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>🏢 Espace <span>Entreprises</span></h1>
    <span id="who" style="color:var(--mut);font-size:14px"></span>
    <button class="btn" id="bell" onclick="toggleNotifs()">🔔<b id="nb" hidden></b></button>
    <button class="btn" onclick="logout()">Déconnexion</button>
  </div>
  <div id="notifs"></div>
  <nav><button id="n-s" class="on" onclick="tab('s')">🔎 Rechercher</button><button id="n-r" onclick="tab('r')">🔑 Mes demandes</button></nav>

  <section id="tab-s">
    <div class="card filters">
      <div><label>Mot-clé (titre, compétence)</label><input id="q" oninput="debounce()"></div>
      <div><label>Compétences (séparées par des virgules)</label><input id="comp" placeholder="python, docker" oninput="debounce()"></div>
      <div><label>Expérience min. (ans)</label><input id="min" type="number" min="0" value="0" oninput="debounce()"></div>
      <div><label>Expérience max. (ans)</label><input id="max" type="number" min="0" value="50" oninput="debounce()"></div>
    </div>
    <div id="list" class="grid"></div>
  </section>
  <section id="tab-r" style="display:none"><div class="card" id="reqs"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ST = { pending: "⏳ En attente", accepted: "✅ Acceptée", refused: "⛔ Refusée" };
async function api(url, opt) {
  const r = await fetch(url, opt);
  if (r.status === 401) { location.href = "/login"; throw new Error("session"); }
  const j = await r.json(); if (!r.ok) throw new Error(j.detail || "Erreur"); return j;
}
function tab(t) {
  $("tab-s").style.display = t === "s" ? "block" : "none"; $("tab-r").style.display = t === "r" ? "block" : "none";
  $("n-s").classList.toggle("on", t === "s"); $("n-r").classList.toggle("on", t === "r");
  t === "s" ? search() : loadReqs();
}
let timer; const debounce = () => { clearTimeout(timer); timer = setTimeout(search, 300); };
async function search() {
  const p = new URLSearchParams({ q: $("q").value, competences: $("comp").value, min_annees: $("min").value || 0, max_annees: $("max").value || 100 });
  const cvs = await api("/api/cvs?" + p);
  $("list").innerHTML = cvs.length ? cvs.map(c => `<div class="card cv">
    <span class="ref">${esc(c.ref)}</span><h3>${esc(c.titre) || "Profil"}</h3>
    <div class="meta">${c.annees} ans d'expérience · ${c.nb_exp} expériences</div>
    <div class="chips">${c.competences.split(",").filter(x => x.trim()).slice(0, 8).map(x => `<span class="chip">${esc(x.trim())}</span>`).join("")}</div>
    <div class="row"><a class="btn" href="/cv/${c.id}.pdf" target="_blank">Voir le CV ↗</a>
    ${c.access ? `<span class="st ${c.access}">${ST[c.access]}</span>` : `<button class="btn primary" onclick="ask('${c.id}')">Demander l'accès</button>`}</div>
  </div>`).join("") : `<div class="empty" style="grid-column:1/-1">Aucun profil ne correspond.</div>`;
}
async function ask(id) {
  const message = prompt("Message pour l'ESM (facultatif) :", "");
  if (message === null) return;
  try { await api("/api/access-requests", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cv_id: id, message }) }); search(); }
  catch (e) { alert(e.message); }
}
async function loadReqs() {
  const rs = await api("/api/my-requests");
  $("reqs").innerHTML = rs.length ? `<table><tr><th>Profil</th><th>Demandée le</th><th>Statut</th><th>Informations</th></tr>${rs.map(r => `<tr>
    <td><b>${esc(r.ref)}</b><br><small style="color:var(--mut)">${esc(r.titre)}</small></td><td>${esc(r.created_at.replace("T", " "))}</td>
    <td><span class="st ${r.status}">${ST[r.status]}</span></td>
    <td>${r.perso ? `<div class="perso"><b>${esc(r.perso.prenom)} ${esc(r.perso.nom)}</b><br>${esc(r.perso.email)}<br>${esc(r.perso.telephone)}<br>${esc(r.perso.ville)}</div>` : "—"}</td></tr>`).join("")}</table>`
    : `<div class="empty">Aucune demande pour l'instant.</div>`;
}
async function loadNotifs() {
  const ns = await api("/api/notifications"), unread = ns.filter(n => !n.read).length;
  $("nb").hidden = !unread; $("nb").textContent = unread;
  $("notifs").innerHTML = ns.length ? ns.map(n => `<div class="${n.read ? "" : "new"}">${esc(n.message)}<small>${esc(n.created_at.replace("T", " "))}</small></div>`).join("") : `<div>Aucune notification.</div>`;
}
async function toggleNotifs() {
  const open = $("notifs").style.display !== "block"; $("notifs").style.display = open ? "block" : "none";
  if (open) { await api("/api/notifications/read", { method: "POST" }); setTimeout(loadNotifs, 1500); }
}
async function logout() { await fetch("/auth/logout", { method: "POST" }); location.href = "/login"; }
(async () => { const me = await api("/auth/me"); $("who").textContent = me.name; search(); loadNotifs(); setInterval(loadNotifs, 20000); })();
</script>
</body>
</html>
